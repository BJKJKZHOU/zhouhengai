<svg xmlns="http://www.w3.org/2000/svg" width="680" height="970" viewBox="0 0 680 970" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">AxDr_L_Motor 固件功能架构</title>
<desc id="diagram-description">上位机通过通信与参数接口配置有感闭环、无感控制与辨识。两种闭环运行路径向 FOC 提供控制参考，再驱动电机。辨识是独立的实验流程。电流和编码器反馈进入 FOC 与状态估计，机械 ESO、磁链观测器及 PLL 为对应模式提供反馈。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#64748b" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:"Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei","PingFang SC",sans-serif;text-anchor:middle;fill:#263343}
.title{font-size:22px;font-weight:650}
.detail{font-size:17px;fill:#4b596b}
.legend{font-size:15px;fill:#4b596b}
.node{fill:none;stroke:#64748b;stroke-width:1.7}
.main,.io,.measure,.link,.feedback{fill:none;stroke:#64748b;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}
.io{marker-start:url(#arrow)}
.link,.feedback{stroke-dasharray:6 5}
</style>
<g aria-label="控制与反馈连线">
<path class="io" d="M340 99 V137"/>
<path class="main" d="M340 228 V282 H188 V304"/>
<path class="main" d="M340 282 H492 V304"/>
<path class="main" d="M188 437 V460 H24 V674 H194 V700"/>
<path class="main" d="M492 437 V460 H647 V674 H486 V700"/>
<path class="link" d="M290 615 V657 H318 V700"/>
<path class="feedback" d="M362 562 H340 V412 H318"/>
<path class="feedback" d="M591 505 V437"/>
<path class="feedback" d="M560 876 H584 V630 H591 V615"/>
<path class="measure" d="M120 875 H86 V746 H120"/>
<path class="main" d="M340 785 V835"/>
</g>
<g aria-label="功能模块">
<g><rect class="node" x="165" y="22" width="350" height="77" rx="10"/><text class="title" x="340" y="59">上位机 / Python 工具</text><text class="detail" x="340" y="89">参数读写 · 控制动作 · 波形采集</text></g>
<g><rect class="node" x="110" y="137" width="460" height="91" rx="10"/><text class="title" x="340" y="174">通信与参数管理</text><text class="detail" x="340" y="204">USB CDC · Parameter / Action · Flash / NVS</text></g>
<g><rect class="node" x="58" y="304" width="260" height="133" rx="10"/><text class="title" x="188" y="341">有感闭环控制</text><text class="detail" x="188" y="371">Torque · Speed · Position</text><text class="detail" x="188" y="399">线性斜坡 · 梯形 · 五次 S 曲线</text></g>
<g><rect class="node" x="362" y="304" width="260" height="133" rx="10"/><text class="title" x="492" y="341">无感控制</text><text class="detail" x="492" y="371">Align → I/F → Observer</text><text class="detail" x="492" y="399">磁链观测与 PLL 接管</text></g>
<g><rect class="node" x="58" y="505" width="260" height="110" rx="10"/><text class="title" x="188" y="542">辨识与相位标定</text><text class="detail" x="188" y="572">Rs/Ls · Flux · J/B</text><text class="detail" x="188" y="600">编码器寻相</text></g>
<g><rect class="node" x="362" y="505" width="260" height="110" rx="10"/><text class="title" x="492" y="542">状态估计</text><text class="detail" x="492" y="572">机械 ESO → 有感速度反馈</text><text class="detail" x="492" y="600">Flux Observer / PLL → 无感</text></g>
<g><rect class="node" x="120" y="700" width="440" height="85" rx="10"/><text class="title" x="340" y="737">FOC 电流控制与 PWM</text><text class="detail" x="340" y="767">Clarke/Park · PI · 可选前馈 · SVPWM</text></g>
<g><rect class="node" x="120" y="835" width="440" height="83" rx="10"/><text class="title" x="340" y="872">三相逆变器与 PMSM</text><text class="detail" x="340" y="902">A/B 相电流采样 · SPI 编码器</text></g>
</g>
<text class="legend" x="340" y="953">实线：控制与采样　　虚线：辨识调用与状态估计反馈</text>
</svg>